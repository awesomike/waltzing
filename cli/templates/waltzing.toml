# Waltzing project configuration
# Generated by `waltzing init`

[project]
name = "{{project_name}}"
version = "0.1.0"
description = ""

[paths]
# Directory containing your .wtz template files
templates = "templates"
# Directory for waltzing-ui components and blocks
ui = "ui"
# Static assets (CSS, JS, images)
static = "static"
# Build output directory
output = "target/waltzing"

[tailwind]
# Tailwind CSS configuration
config = "tailwind.config.js"
input = "static/input.css"
output = "static/output.css"

[alpine]
# Alpine.js plugins to include
plugins = ["@alpinejs/focus", "@alpinejs/collapse"]

[components]
# Components installed via `waltzing add` will be listed here
# Example:
# button = { version = "0.1.0" }
# card = { version = "0.1.0" }

[theme]
# Theme preset (default, zinc, slate, stone, gray, neutral, red, rose, orange, green, blue, yellow, violet)
preset = "default"
# Border radius for components
radius = "0.5rem"
